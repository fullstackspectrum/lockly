name: Docker Hub description

# Keeps the Docker Hub overview in step with dockerhub.md. Its images load from
# main on GitHub, so it syncs on every change there rather than on release.
# Updating a description needs a token with Read, Write & Delete access, more than
# the image push needs, so it has its own secret: DOCKERHUB_DESCRIPTION_TOKEN.

on:
  push:
    branches: [main]
    paths:
      - dockerhub.md
      - .github/workflows/dockerhub-description.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_DESCRIPTION_TOKEN }}
          repository: fullstackspectrum/lockly
          short-description: Explain lockfile changes and flag the ones that deserve a review
          readme-filepath: ./dockerhub.md
