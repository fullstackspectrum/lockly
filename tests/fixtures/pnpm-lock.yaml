---
lockfileVersion: '9.0'

importers:

  .:
    packageManagerDependencies:
      pnpm:
        specifier: 10.0.0
        version: 10.0.0

packages:

  pnpm@10.0.0:
    resolution: {integrity: sha512-PNPM}

---
lockfileVersion: '9.0'

settings:
  autoInstallPeers: true

importers:

  .:
    dependencies:
      '@scope/util':
        specifier: ^2.0.0
        version: 2.0.0(react@18.3.1)
      local:
        specifier: link:packages/local
        version: link:packages/local
    devDependencies:
      left-pad:
        specifier: ^1.3.0
        version: 1.3.0

packages:

  '@scope/util@2.0.0':
    resolution: {integrity: sha512-BBB}
    engines: {node: '>=18'}

  left-pad@1.3.0:
    resolution: {integrity: sha512-AAA}
    deprecated: use String.prototype.padStart()

  tiny@0.1.0:
    resolution: {tarball: https://npm.example.com/tiny/-/tiny-0.1.0.tgz}

snapshots:

  '@scope/util@2.0.0(react@18.3.1)':
    dependencies:
      tiny: 0.1.0
